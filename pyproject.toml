[project]
name = "cka-arena"
version = "0.1.0"
description = "CKA Arena — simulador local de exames CKA com terminal no browser e cluster Multipass gerenciado"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=12",
]

[project.scripts]
cka-arena = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "websockets>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
