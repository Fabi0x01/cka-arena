name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Python tests
        run: uv run pytest -q

      - name: Seed gates (no cluster required)
        run: uv run python -m app.seed validate --gates-only 2>/dev/null || true

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n setup.sh
          for f in scripts/lib/*.sh scripts/cluster/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning setup.sh scripts/lib/*.sh scripts/cluster/*.sh
